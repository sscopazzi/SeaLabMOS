version = 1
SPDX-PackageName = "SeaLabMOS"
SPDX-PackageSupplier = "Aspect Wave LLC"
SPDX-PackageDownloadLocation = "https://github.com/sscopazzi/SeaLabMOS"

# When more than one block matches a file, the last one wins: general blocks first, exceptions after.

# Documentation, manuals, course materials, papers, figures and data
[[annotations]]
path = ["**.md", "*.pdf", "Course_Materials/**", "Publications/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Aspect Wave LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "Publications/OCEANS_Chicago_2025_Paper_and_Figures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Aspect Wave LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "Publications/JOT_Paper_Application/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Analysis notebooks and their environment files: permissive, so researchers can use them in their own pipelines
[[annotations]]
path = "Publications/OCEANS_Chicago_2025_Paper_and_Figures/**.ipynb"
precedence = "override"
SPDX-FileCopyrightText = "2025 Aspect Wave LLC"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["Publications/JOT_Paper_Application/**.ipynb", "Publications/JOT_Paper_Application/environment.yml",
        "Publications/JOT_Paper_Application/requirements.txt", "Publications/JOT_Paper_Application/.gitignore"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "MIT"

# Hardware design source: CAD (SolidWorks parts and their STL exports) and the KiCad wiring diagram
[[annotations]]
path = ["CAD_FIles/**", "Wire_Diagram/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Aspect Wave LLC"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Compiled firmware (can't carry a header). The libraries linked into it are listed in THIRD_PARTY_NOTICES.md.
[[annotations]]
path = "SeaLabMOS_master_program/build/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Aspect Wave LLC"
SPDX-License-Identifier = "GPL-3.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-or-later AND BSD-3-Clause AND BSD-2-Clause AND MIT"

# Editor settings
[[annotations]]
path = ".vscode/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "CC0-1.0"

# z_v1: the first version, archived as released, under CC0. Third-party parts follow.
[[annotations]]
path = "z_v1/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2024 Aspect Wave LLC"
SPDX-License-Identifier = "CC0-1.0"

# z_v1 code from others
[[annotations]]
path = "z_v1/SeaLabCTD_v1/c_older_version_of_CTD/CTD_deliverables/sensor_testing/pressSensor_test/pressSensor_test.ino"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2014 Casey Kuhns, SparkFun Electronics", "2020 Aspect Wave LLC"]
SPDX-License-Identifier = "Beerware AND CC0-1.0"

[[annotations]]
path = "z_v1/SeaLabCTD_v1/c_older_version_of_CTD/CTD_deliverables/sensor_testing/SD_test/SD_test.ino"
precedence = "aggregate"
SPDX-FileCopyrightText = ["Carson Alexander", "2020 Aspect Wave LLC"]
SPDX-License-Identifier = "LicenseRef-Third-Party-Reference AND CC0-1.0"

[[annotations]]
path = "z_v1/SeaLabCTD_v1/c_older_version_of_CTD/CTD_deliverables/sensor_testing/tempSensor_test/tempSensor_test.ino"
precedence = "aggregate"
SPDX-FileCopyrightText = ["Last Minute Engineers", "2020 Aspect Wave LLC"]
SPDX-License-Identifier = "LicenseRef-Third-Party-Reference AND CC0-1.0"

